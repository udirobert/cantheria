[project]
name = "tinyhttp"
version = "0.1.0"
description = "A very small HTTP toolkit: chunked decoding, headers, client glue."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
